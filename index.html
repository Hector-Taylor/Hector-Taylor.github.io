<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2efe8" />
    <meta name="description" content="Hector Taylor." />
    <title>Hector Taylor</title>
    <link rel="canonical" href="https://hectortayl.org/" />
    <link rel="icon" href="./assets/personal-site/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/personal-site/style.css" />
    <script src="./assets/personal-site/field.js" defer></script>
    <script src="./assets/personal-site/site.js" defer></script>
  </head>
  <body>
    <main class="hero" aria-labelledby="name">
      <div class="optical-field" aria-hidden="true">
        <div class="field-fallback"></div>
        <canvas id="membrane"></canvas>
      </div>
      <h1 id="name">Hector<br />Taylor</h1>
      <footer class="controls">
        <a id="cv-open" href="./assets/personal-site/hector-taylor-cv.pdf" aria-haspopup="dialog">CV <span aria-hidden="true">↗</span></a>
      </footer>
    </main>

    <dialog id="cv-dialog" aria-labelledby="cv-title">
      <header class="cv-header">
        <div>
          <h2 id="cv-title">Curriculum vitae</h2>
          <p>3 pages</p>
        </div>
        <div class="cv-actions">
          <a href="./assets/personal-site/hector-taylor-cv.pdf" target="_blank" rel="noopener">Open PDF <span aria-hidden="true">↗</span></a>
          <button id="cv-close" type="button" aria-label="Close CV" autofocus>×</button>
        </div>
      </header>
      <div class="cv-pages" tabindex="0" role="region" aria-label="CV preview, three pages. Open the PDF for selectable text and links.">
        <img src="./assets/personal-site/original-cv-page-1.png" width="1160" height="1500" loading="lazy" alt="CV page 1 of 3: contact information, education, and research experience." />
        <img src="./assets/personal-site/original-cv-page-2.png" width="1160" height="1500" loading="lazy" alt="CV page 2 of 3: research experience, invited talks, publications, and conference presentations." />
        <img src="./assets/personal-site/original-cv-page-3.png" width="1160" height="1500" loading="lazy" alt="CV page 3 of 3: leadership, mentorship, work and volunteer experience, awards, and technical skills." />
      </div>
    </dialog>
  </body>
</html>
